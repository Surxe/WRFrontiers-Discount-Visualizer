name: Build frontend
description: Check out game data, install dependencies, build the Astro site, and record which Data commit it was built from

inputs:
  data-ref:
    description: WRFrontiersDB-Data ref to build from
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Set up frontend
      uses: ./.github/actions/setup-frontend
      with:
        data-ref: ${{ inputs.data-ref }}

    - name: Build frontend
      shell: bash
      working-directory: src/frontend
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        if [ -f public/discount-table.png ]; then
          mv public/discount-table.png public/discount-table-${SHORT_SHA}.png
        fi
        if [ -f public/predictions-og.png ]; then
          mv public/predictions-og.png public/predictions-og-${SHORT_SHA}.png
        fi
        PUBLIC_IMAGE_SHA=$SHORT_SHA npm run build

    # Served as /deploy.json, and uploaded as the deploy-record run artifact
    # that the Orchestrator copies into its deploy state.
    - name: Record deploy
      uses: Surxe/WRFrontiersDB-Data/.github/actions/record-deploy@main
      with:
        data-path: src/frontend/public/WRFrontiersDB-Data
        out: src/frontend/dist/deploy.json
