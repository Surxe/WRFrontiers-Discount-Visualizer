name: Build frontend
description: Check out game data, install dependencies, build the Astro site, render its og:images, and record which Data commit it was built from

inputs:
  data-ref:
    description: WRFrontiersDB-Data ref to build from
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Set up frontend
      uses: ./.github/actions/setup-frontend
      with:
        data-ref: ${{ inputs.data-ref }}

    - name: Install Chromium (for og:image capture)
      shell: bash
      run: npx --prefix src/frontend puppeteer browsers install chrome

    # The og:images are rendered from this same build (same data), straight into
    # dist/ as `<name>-<sha>.png` -- the filenames GenericPage/DiscountPage put
    # in og:image. Never deploy the PNGs committed in public/: they only change
    # on an all.yml run, so any other deploy would ship a stale card.
    - name: Build frontend
      shell: bash
      working-directory: src/frontend
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        PUBLIC_IMAGE_SHA=$SHORT_SHA npm run build
        npm run capture -- --out dist/discount-table-${SHORT_SHA}.png
        npm run capture:og -- --out dist/predictions-og-${SHORT_SHA}.png

    # Served as /deploy.json, and uploaded as the deploy-record run artifact
    # that the Orchestrator copies into its deploy state.
    - name: Record deploy
      uses: Surxe/WRFrontiersDB-Data/.github/actions/record-deploy@main
      with:
        data-path: src/frontend/public/WRFrontiersDB-Data
        out: src/frontend/dist/deploy.json
