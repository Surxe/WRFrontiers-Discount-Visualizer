name: Local mapping
description: Map discounts (manual pin -> exact match -> Jev) and write frontend JSON (steps 1–3)

inputs:
  target_date_range:
    description: Target date range (e.g. "06-16 06-23"). Required with items; defaults to the event's dates with event_id.
    required: false
    default: ''
  items:
    description: Comma-separated item names to map. Give this or event_id.
    required: false
    default: ''
  event_id:
    description: Discord scheduled-event id of the discount week; its description is parsed for the items. Give this or items.
    required: false
    default: ''
  commit:
    description: Commit and push mapped discount JSON
    required: false
    default: 'true'

outputs:
  data-sha:
    description: The WRFrontiersDB-Data commit the mapping used; later jobs build from it
    value: ${{ steps.data.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Checkout Data Repo
      id: data
      uses: Surxe/WRFrontiersDB-Data/.github/actions/checkout-data@main
      with:
        path: WRFrontiersDB-Data

    - name: Install Python dependencies
      shell: bash
      run: pip install -r src/backend/requirements.txt

    - name: Run Orchestrator Pipeline
      shell: bash
      # Inputs go through env, not inline ${{ }}, so free text with quotes or
      # $ can't break (or inject into) the command. run.py checks that exactly
      # one of items / event_id is set.
      env:
        ITEMS: ${{ inputs.items }}
        EVENT_ID: ${{ inputs.event_id }}
        DATE_RANGE: ${{ inputs.target_date_range }}
      run: python src/backend/run.py --items "$ITEMS" --event-id "$EVENT_ID" --date-range "$DATE_RANGE"

    - name: Commit and push changes
      if: inputs.commit == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore(data): update mapped discounts [skip ci]'
        file_pattern: 'archive/discounts/*.json src/frontend/public/data/** src/backend/game_data/game_data.json src/backend/manual_mapping.json'
