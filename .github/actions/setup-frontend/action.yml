name: Set up frontend
description: Check out game data into the frontend's public/ at a given Data ref, then install the frontend's dependencies

inputs:
  data-ref:
    description: WRFrontiersDB-Data ref; all.yml passes the sha its map job used, so every job builds from the same data
    required: false
    default: main

runs:
  using: composite
  steps:
    # Checkout into public/ so Vite can copy assets (symlinks break: ln -s
    # ../../… from src/frontend resolves to src/WRFrontiersDB-Data, not repo root).
    - name: Checkout Data Repo
      uses: Surxe/WRFrontiersDB-Data/.github/actions/checkout-data@deploy-record
      with:
        path: src/frontend/public/WRFrontiersDB-Data
        ref: ${{ inputs.data-ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install frontend dependencies
      shell: bash
      working-directory: src/frontend
      run: npm install

    - name: Verify WRFrontiersDB-Data checkout
      shell: bash
      run: test -f src/frontend/public/WRFrontiersDB-Data/current/Objects/Module.json
