name: Screenshot discount table
description: Build the Astro site, capture the discount grid and predictions og card via Puppeteer, and optionally commit the PNGs to the repo (for the README; deploys render their own in the build action).

inputs:
  commit:
    description: Commit and push discount-table.png
    required: false
    default: 'true'
  data-ref:
    description: WRFrontiersDB-Data ref to build from
    required: false
    default: main

runs:
  using: composite
  steps:
    # Data checkout + npm install (includes puppeteer).
    - name: Set up frontend
      uses: ./.github/actions/setup-frontend
      with:
        data-ref: ${{ inputs.data-ref }}

    - name: Install Chromium dependencies (Ubuntu)
      shell: bash
      run: npx --prefix src/frontend puppeteer browsers install chrome

    - name: Build frontend (needed for astro preview)
      shell: bash
      working-directory: src/frontend
      run: npm run build

    - name: Capture discount table screenshot
      shell: bash
      working-directory: src/frontend
      run: npm run capture

    - name: Capture predictions og:image
      shell: bash
      working-directory: src/frontend
      run: npm run capture:og

    - name: Commit and push screenshots
      if: inputs.commit == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore(data): update discount-table.png + predictions-og.png [skip ci]'
        file_pattern: 'src/frontend/public/discount-table.png src/frontend/public/predictions-og.png'
