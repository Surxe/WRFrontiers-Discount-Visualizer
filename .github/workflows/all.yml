name: All

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'Item names, comma-separated (e.g. "Phantom, Lighter, Blink"). Fill this OR event_id.'
        required: false
        type: string
        default: ''
      event_id:
        description: 'OR the Discord event id (last segment of a discord.com/events/<guild>/<event> link); leave items empty.'
        required: false
        type: string
        default: ''
      target_date_range:
        description: 'Target date range (e.g. "06-16 06-23"). Required with items; leave empty with event_id to use the event''s dates.'
        required: false
        type: string
        default: ''
      skip_deploy:
        description: Run map only (skip build/deploy)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    # The screenshot and build jobs check out this same Data commit, so the
    # whole run (and its /deploy.json) is built from one Data commit.
    outputs:
      data_sha: ${{ steps.map.outputs.data-sha }}
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Log inputs
        shell: bash
        env:
          ITEMS: ${{ github.event.inputs.items }}
          EVENT_ID: ${{ github.event.inputs.event_id }}
          DATE_RANGE: ${{ github.event.inputs.target_date_range }}
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy }}
        run: |
          {
            echo "### Workflow inputs"
            echo "- items: \`$ITEMS\`"
            echo "- event_id: \`$EVENT_ID\`"
            echo "- target_date_range: \`$DATE_RANGE\`"
            echo "- skip_deploy: \`$SKIP_DEPLOY\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Local mapping
        id: map
        uses: ./.github/actions/map
        with:
          target_date_range: ${{ github.event.inputs.target_date_range }}
          items: ${{ github.event.inputs.items }}
          event_id: ${{ github.event.inputs.event_id }}

  screenshot:
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    needs: map
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Pull map commit
        shell: bash
        run: git pull origin "${{ github.ref_name }}"

      - name: Capture discount table screenshot
        uses: ./.github/actions/screenshot
        with:
          data-ref: ${{ needs.map.outputs.data_sha }}

  build:
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    # Renders its own og:images from the data it deploys, so it does not wait
    # on the screenshot job (which only refreshes the PNGs committed for the README).
    needs: map
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pull map commit
        shell: bash
        run: git pull origin "${{ github.ref_name }}"

      - name: Build frontend
        uses: ./.github/actions/build
        with:
          data-ref: ${{ needs.map.outputs.data_sha }}

      - name: Upload Pages artifact
        uses: ./.github/actions/deploy

  publish:
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
