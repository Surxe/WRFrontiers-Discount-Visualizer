name: Map

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'Item names, comma-separated (e.g. "Phantom, Lighter, Blink"). Fill this OR event_id.'
        required: false
        type: string
        default: ''
      event_id:
        description: 'OR the Discord event id (last segment of a discord.com/events/<guild>/<event> link); leave items empty.'
        required: false
        type: string
        default: ''
      target_date_range:
        description: 'Target date range (e.g. "06-16 06-23"). Required with items; leave empty with event_id to use the event''s dates.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Local mapping
        uses: ./.github/actions/map
        with:
          target_date_range: ${{ github.event.inputs.target_date_range }}
          items: ${{ github.event.inputs.items }}
          event_id: ${{ github.event.inputs.event_id }}
