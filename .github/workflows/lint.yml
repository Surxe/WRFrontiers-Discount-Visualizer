name: Style Lint

# Guards the "use --wrf-* tokens, not raw chrome hex" rule via the shared
# lint-styles.cjs in the WRFrontiersDB-Design submodule. Unlike the other
# workflows here (all workflow_dispatch), this runs automatically on PRs so
# style drift is caught before merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run style lint (raw chrome hex)
        run: node src/frontend/vendor/wrf-design/lint-styles.cjs --config .wrf-lint.json
